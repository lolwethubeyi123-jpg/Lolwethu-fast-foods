<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make an Enquiry | Lolwethu's Fast Food Kitchen, Gqeberha</title>
    <meta name="description" content="Enquire about gatsbies, kotas, wings and more from Lolwethu's Fast Food Kitchen in Gqeberha. Get an instant price estimate and see if we are open for collection or delivery.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">
    <script src="../js/forms.js" defer></script>
</head>
<body>

    <header class="site-header">
        <a href="../index.html">
            <img src="../Assets/Lolwethu's fast food logo.png" alt="Lolwethu's Fast Food Kitchen logo" width="120" height="90">
        </a>
        <nav class="nav-links" aria-label="Main navigation">
            <a href="../index.html">Home</a>
            <a href="./about.html">About Us</a>
            <a href="./contact.html">Contact Us</a>
            <a href="./menu.html">Menu</a>
            <a href="./enquiry.html">Enquiry</a>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h1>Make an Enquiry</h1>
            <p>Fill in the form below if you have any questions or custom kitchen orders.</p>

            <form id="enquiryForm" action="#" method="POST" novalidate>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required data-rule="name">
                    <small id="nameError" class="form-error"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="e.g. 082 123 4567" autocomplete="tel" required data-rule="phone">
                    <small id="phoneError" class="form-error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email" required data-rule="email">
                    <small id="emailError" class="form-error"></small>
                </div>

                <div class="form-group">
                    <label for="meal">Select a Meal Choice</label>
                    <select id="meal" name="meal" required data-rule="select" data-error="Please choose a meal.">
                        <option value="">-- Choose an option --</option>
                        <option value="gatsby" data-price="65">Full Special Gatsby</option>
                        <option value="kota" data-price="45">Special Kota</option>
                        <option value="wings" data-price="55">Wings &amp; Chips</option>
                        <option value="russian" data-price="40">Russian &amp; Chips</option>
                        <option value="burger" data-price="60">Burger &amp; Chips Combo</option>
                    </select>
                    <small id="mealError" class="form-error"></small>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" min="1" max="50" value="1" required data-rule="quantity">
                    <small id="quantityError" class="form-error"></small>
                </div>

                <div class="form-group">
                    <label for="service">Collection or Delivery</label>
                    <select id="service" name="service" required>
                        <option value="collection">Collection (free)</option>
                        <option value="delivery">Delivery (R20 fee)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Enquiry</label>
                    <textarea id="message" name="message" rows="5" maxlength="1000" placeholder="Write your enquiry here..." required data-rule="message"></textarea>
                    <small id="messageError" class="form-error"></small>
                </div>

                <button type="submit" class="submit-btn">Submit Enquiry</button>
            </form>

            <!-- Shown by forms.js once the input has been validated -->
            <div id="enquiryResponse" class="response-box" aria-live="polite"></div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Lolwethu's Fast Food Kitchen</p>
    </footer>

</body>
</html>
